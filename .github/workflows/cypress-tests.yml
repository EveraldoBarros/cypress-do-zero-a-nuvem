# Nome do workflow que aparece na aba Actions
name: Testes com Cypress

# 🎯 Quando executar
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  # Permite executar manualmente pela interface
  workflow_dispatch:

# ⚙️ Tarefas
jobs:
  cypress-run:
    name: Executar Testes Cypress
    # 🖥️ Sistema operacional
    runs-on: ubuntu-latest

    # 📦 Passos de execução
    steps:
      # 1. Baixar o código do repositório
      - name: Baixar código
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # ✅ Use a versão do seu projeto

      # 3. Cache de dependências (acelera execuções futuras)
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 4. Instalar dependências
      - name: Instalar pacotes
        run: npm ci

      # 5. Cache do binário do Cypress
      - name: Cache Cypress
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            cypress-

      # 6. Instalar binário do Cypress
      - name: Instalar Cypress
        run: npx cypress install

      # 7. Iniciar aplicação em segundo plano (se necessário)
      - name: Iniciar aplicação
        run: npm start &
        env:
          PORT: 3000

      # ⏳ Aguardar a aplicação inicializar
      - name: Aguardar servidor
        uses: gradle/wait-for-it@master
        with:
          host: localhost
          port: 3000
          timeout: 60

      # 8. 🧪 Executar testes Cypress
      - name: Rodar testes Cypress
        uses: cypress-io/github-action@v6
        with:
          command: npm run cypress:run
          # Ou simplesmente:
          # build: npm run build
          # start: npm start
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120

      # 9. 📤 Upload de capturas de tela e vídeos (em caso de falha)
      - name: Salvar capturas de tela e vídeos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-evidencias
          path: |
            cypress/screenshots
            cypress/videos